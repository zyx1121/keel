name: keel-build

on:
  workflow_call:
    inputs:
      app:
        description: "Image name (used as ghcr.io/<owner>/<app>)"
        required: true
        type: string
      owner:
        description: "GitHub owner (default: repository owner)"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      deploy:
        description: "SSH into server and call keel deploy after push"
        required: false
        type: boolean
        default: false
      keel_config:
        description: "Path to keel.yaml on the server (passed as KEEL_CONFIG)"
        required: false
        type: string
        default: ""
    secrets:
      KEEL_HOST:
        description: "SSH target (user@host)"
        required: false
      KEEL_SSH_KEY:
        description: "Private SSH key for KEEL_HOST"
        required: false
    outputs:
      image_ref:
        description: "Full image reference pushed (ghcr.io/<owner>/<app>:<sha>)"
        value: ${{ jobs.build.outputs.image_ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        env:
          INPUT_OWNER: ${{ inputs.owner }}
          INPUT_APP: ${{ inputs.app }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="${INPUT_OWNER:-$GITHUB_REPOSITORY_OWNER}"
          SHA=$(git rev-parse --short HEAD)
          IMAGE_BASE="ghcr.io/${OWNER}/${INPUT_APP}"
          IMAGE_REF="${IMAGE_BASE}:${SHA}"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}"   >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"               >> "$GITHUB_OUTPUT"
          # Detect semver push (tag refs/tags/v*)
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF#refs/tags/v}"
            echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.image_ref }}
          load: true

      - name: Push SHA tag
        run: docker push ${{ steps.meta.outputs.image_ref }}

      - name: Push SemVer tag (tagged push only)
        if: steps.meta.outputs.semver != ''
        run: |
          SEMVER_TAG="${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.semver }}"
          docker tag "${{ steps.meta.outputs.image_ref }}" "$SEMVER_TAG"
          docker push "$SEMVER_TAG"

      - name: Deploy via SSH
        if: inputs.deploy == true
        env:
          KEEL_HOST: ${{ secrets.KEEL_HOST }}
          KEEL_CONFIG: ${{ inputs.keel_config }}
        run: |
          echo "${{ secrets.KEEL_SSH_KEY }}" > /tmp/keel_key
          chmod 600 /tmp/keel_key
          REMOTE_CMD="keel deploy ${{ steps.meta.outputs.image_ref }}"
          if [[ -n "${KEEL_CONFIG}" ]]; then
            REMOTE_CMD="KEEL_CONFIG=${KEEL_CONFIG} ${REMOTE_CMD}"
          fi
          ssh -i /tmp/keel_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              "${KEEL_HOST}" "${REMOTE_CMD}"
          rm -f /tmp/keel_key
